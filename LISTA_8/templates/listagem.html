<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
</head>
<body>
    <h1>Lista de Produtos</h1>

    <table border="1">
        <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Valor</th>
        </tr>

        {% for produto in produtos %}
            <tr>
                <td>{{ produto.codigo }}</td>
                <td>{{ produto.descricao }}</td>
                <td>{{ produto.valor }}</td>
            </tr>
        {% endfor %}

    </table>
    <br>
    <button><a href="{{url_for('produto.novo')}}">Voltar</a></button>
</body>
</html>
