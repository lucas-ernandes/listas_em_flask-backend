
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Produtos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('produto_rota.inicio') }}">
            Sistema de Produtos
        </a>
        <div>
            <a class="btn btn-outline-light btn-sm"
               href="{{ url_for('produto_rota.listar') }}">Produtos</a>
            <a class="btn btn-success btn-sm"
               href="{{ url_for('produto_rota.novo') }}">Cadastrar</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }}">{{ mensagem }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
