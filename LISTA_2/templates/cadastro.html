<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Cadastro do Usuario</h1>
    <form action="{{ url_for('exibir_resultado') }}" method="POST">
        <div>
            <label>Nome: </label>
            <input type="text" name="user_name">
        </div>

<br>

        <div>
            <label>Idade: </label>
            <input type="text" name="user_idade">
        </div>
<br>

        <div>
            <label>Curso: </label>
            <input type="text" name="user_curso">
        </div>
<br>

        <button type="submit">Confirmar</button>
    </form>

</body>
</html>
