<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Insta</title>

    <!-- css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
</head>
<body>
    <header class="navbar">
        <nav class="nav-links">
            <ul>
                <li><a href="">Inicio</a></li>
                <li><a href="">Publicar</a></li>
                <li><a href="">Logout</a></li>
            </ul>
        </nav>

        <!-- nome logado -->
        <div class="perfil">
            {% if session.get('usuario_id') %}
                <span class="nome_perfil">
                Olá, {{session.get('username', '').split()[0]}}
                </span>
                
                <a href="/logout">Sair</a>
            {% endif %}
        </div>
    </header>
    
    {% block content %}
    {% endblock %}
</body>
</html>
